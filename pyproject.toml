[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adrorga-finetuneplat_jd441"
version = "0.1.0"
description = "从输入中抽取数值，计算模型微调平台工程师·梯度累积与有效批量相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "adrorga" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://adrorga.github.io"
Repository = "https://github.com/adrorga/finetuneplat_jd441"
Issues = "https://github.com/adrorga/finetuneplat_jd441/issues"

[project.scripts]
finetuneplat_jd441 = "finetuneplat_jd441:main"

[tool.setuptools]
py-modules = ["finetuneplat_jd441"]
